name: Anchor referee transparency log
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anchor-log
  cancel-in-progress: false
jobs:
  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Verify + anchor the live log head
        run: python scripts/translog.py anchor
      - name: Commit anchor
        run: |
          if git diff --quiet -- transparency/; then echo "no change"; exit 0; fi
          git config user.name "qortime-anchor-bot"
          git config user.email "qortime-anchor-bot@users.noreply.github.com"
          git add transparency/anchors.jsonl
          git commit -m "transparency: anchor referee log head [skip ci]"
          git push
