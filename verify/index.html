<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QorTime verifier</title>
<style>
body{font:16px system-ui,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;background:#0d1117;color:#e6edf3}
textarea,input{width:100%;box-sizing:border-box;background:#161b22;color:#e6edf3;border:1px solid #30363d;border-radius:6px;padding:.5rem;font:13px ui-monospace,monospace}
textarea{height:260px}button{margin-top:.75rem;padding:.6rem 1.2rem;font-weight:600;border-radius:6px;border:0;cursor:pointer}
#badge{font-size:2rem;font-weight:800;margin-top:1rem}.VERIFIED{color:#3fb950}.PARTIAL{color:#d29922}.FAIL{color:#f85149}
.tier{display:inline-block;margin-left:1rem;font-size:1rem;padding:.2rem .6rem;border:1px solid #30363d;border-radius:99px}
pre{background:#161b22;padding:.75rem;border-radius:6px;white-space:pre-wrap}small{color:#8b949e}
</style></head><body>
<h1>QorTime verifier</h1><p><small><a href="../" style="color:#7df9ff">← QorTime home</a></small></p>
<p><small>Runs entirely in your browser. Nothing is uploaded. Checks Ed25519 signatures (players + referee), the referee-countersigned checkpoint chain, nonce challenges, and the trust tier.</small></p>
<label>Receipt JSON (paste or choose a file)</label>
<input type="file" id="file" accept=".json,application/json">
<textarea id="json" placeholder='{"schema":"qor-receipt/v0", ...}'></textarea>
<label>Pinned referee public key (hex). Leave blank and the result is at most PARTIAL.</label>
<input id="pub" placeholder="64 hex chars">
<button id="go">Verify</button>
<div id="badge"></div><pre id="out" hidden></pre>
<script type="module">
import { verifyReceipt } from "./verify.js";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search); if (q.get("referee")) $("pub").value = q.get("referee");
$("file").onchange = async (e) => { $("json").value = await e.target.files[0].text(); };
$("go").onclick = async () => {
  let r; try { r = JSON.parse($("json").value); } catch { $("badge").className = "FAIL"; $("badge").textContent = "FAIL: not JSON"; return; }
  const v = await verifyReceipt(r, $("pub").value.trim() || null);
  $("badge").className = v.status;
  $("badge").innerHTML = `${v.status}<span class="tier">${v.trust_tier ?? "no tier"}</span>`;
  const res = r.result || {};
  $("out").hidden = false;
  $("out").textContent = `match ${r.match?.match_id}  ${r.match?.game}/${r.match?.platform}\n` +
    `final: away ${res.away_score} @ home ${res.home_score} (Q${res.quarter}), winner ${res.winner}\n\n` + JSON.stringify(v, null, 2);
};
</script></body></html>
